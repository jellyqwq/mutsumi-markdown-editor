name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($VERSION) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=mutsumi-markdown-editor-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npx --yes @vscode/vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VSIX="${{ steps.version.outputs.vsix }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" "$VSIX" --title "$TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes
            fi
          fi
